name: Python smoke checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q qalb_lang

      - name: Run the documented interpreter example
        shell: bash
        run: |
          set -euo pipefail
          output="$(python qalb_lang/qalb.py qalb_lang/examples/test.qalb)"
          printf '%s\n' "$output"
          grep -Fq '55.0' <<< "$output"
          grep -Fq 'المجموع أكبر من 50' <<< "$output"
